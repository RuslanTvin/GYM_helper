name: Build GYM_helper

on:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build application
        run: pyinstaller --name GYM_helper main.py

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: GYM_helper-Windows
          path: dist/GYM_helper/